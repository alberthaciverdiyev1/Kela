<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kela</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Kela.App.Shared/css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
    <style>
        /* Boot loader — Loader.razor ilə eyni görünüş (Blazor mount olmamışdan əvvəl) */
        .lms-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F7FAF7; font-family: system-ui, sans-serif; }
        .lms-boot-ring { position: relative; display: flex; height: 88px; width: 88px; align-items: center; justify-content: center; }
        .lms-boot-ring i { position: absolute; inset: 0; border-radius: 9999px; border: 1.5px solid transparent; border-top-color: #2D8063; border-right-color: #A5CEB6; animation: lms-rot 2.1s linear infinite; }
        .lms-boot-ring i.inner { inset: 11px; border-top-color: transparent; border-right-color: transparent; border-bottom-color: #61AB85; border-left-color: #C0DECC; animation: lms-rot 2.8s linear infinite reverse; }
        .lms-boot-core { display: flex; height: 37px; width: 37px; align-items: center; justify-content: center; border-radius: 13px; background: linear-gradient(135deg, #439C76, #246D50); box-shadow: 0 10px 15px -3px rgba(0,0,0,.15); }
        .lms-boot-title { margin: 28px 0 0; font-size: 15px; font-weight: 600; color: #234D3B; }
        .lms-boot-sub { margin: 6px 0 0; font-size: 12px; color: #8AA598; }
        .lms-boot-bar { margin-top: 20px; height: 3px; width: 112px; overflow: hidden; border-radius: 9999px; background: #DCE9DF; }
        .lms-boot-bar span { display: block; height: 100%; width: 40%; border-radius: 9999px; background: #398D68; animation: lms-slide 1.5s ease-in-out infinite; }
        @keyframes lms-rot { to { transform: rotate(360deg); } }
        @keyframes lms-slide { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
        @media (prefers-reduced-motion: reduce) { .lms-boot-ring i, .lms-boot-bar span { animation: none; } }
    </style>
</head>
<body>
    <div id="app">
        <div class="lms-boot" role="status" aria-label="Yüklənir">
            <div class="lms-boot-ring">
                <i></i><i class="inner"></i>
                <div class="lms-boot-core">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20V11M12 14C7 14 5 10 5 5c5 0 7 3 7 7M12 16c0-5 2-8 7-8 0 5-2 8-7 8" />
                    </svg>
                </div>
            </div>
            <p class="lms-boot-title">Yüklənir...</p>
            <p class="lms-boot-sub">Bir az gözləyin</p>
            <div class="lms-boot-bar"><span></span></div>
        </div>
    </div>
    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#feecef;color:#c0392b;padding:12px;text-align:center;font-family:system-ui">
        Xəta baş verdi. <a href="." class="reload">Yenilə</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="js/video-player.js"></script>
    <script src="_content/Kela.App.Shared/js/lms-guard.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
