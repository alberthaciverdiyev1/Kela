<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Edutor</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Edutor.App.Shared/css/app.css" />
    <link rel="icon" type="image/png" href="_content/Edutor.App.Shared/images/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="_content/Edutor.App.Shared/images/favicons/favicon.svg" />
    <link rel="shortcut icon" href="_content/Edutor.App.Shared/images/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="_content/Edutor.App.Shared/images/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bubora" />
    <link rel="manifest" href="_content/Edutor.App.Shared/images/favicons/site.webmanifest" />
    <script type="importmap"></script>
    <style>
        /* Boot loader — Loader.razor ilə eyni görünüş (Blazor mount olmamışdan əvvəl) */
        .lms-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F7FAF7; font-family: system-ui, sans-serif; }
        .lms-boot-ring { position: relative; display: flex; height: 88px; width: 88px; align-items: center; justify-content: center; }
        .lms-boot-ring i { position: absolute; inset: 0; border-radius: 9999px; border: 1.5px solid transparent; border-top-color: #2D8063; border-right-color: #A5CEB6; animation: lms-rot 2.1s linear infinite; }
        .lms-boot-ring i.inner { inset: 11px; border-top-color: transparent; border-right-color: transparent; border-bottom-color: #61AB85; border-left-color: #C0DECC; animation: lms-rot 2.8s linear infinite reverse; }
        .lms-boot-core { display: block; height: 52px; width: 52px; object-fit: contain; mix-blend-mode: multiply; }
        .lms-boot-title { margin: 28px 0 0; font-size: 15px; font-weight: 600; color: #234D3B; }
        .lms-boot-sub { margin: 6px 0 0; font-size: 12px; color: #8AA598; }
        .lms-boot-bar { margin-top: 20px; height: 3px; width: 112px; overflow: hidden; border-radius: 9999px; background: #DCE9DF; }
        .lms-boot-bar span { display: block; height: 100%; width: 40%; border-radius: 9999px; background: #398D68; animation: lms-slide 1.5s ease-in-out infinite; }
        @keyframes lms-rot { to { transform: rotate(360deg); } }
        @keyframes lms-slide { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
        @media (prefers-reduced-motion: reduce) { .lms-boot-ring i, .lms-boot-bar span { animation: none; } }
    </style>
</head>
<body>
    <div id="app">
        <div class="lms-boot" role="status" aria-label="Yüklənir">
            <div class="lms-boot-ring">
                <i></i><i class="inner"></i>
                <img class="lms-boot-core" src="_content/Edutor.App.Shared/images/logo/logo-small.png" alt="" />
            </div>
            <p class="lms-boot-title">Yüklənir...</p>
            <p class="lms-boot-sub">Bir az gözləyin</p>
            <div class="lms-boot-bar"><span></span></div>
        </div>
    </div>
    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#feecef;color:#c0392b;padding:12px;text-align:center;font-family:system-ui">
        Xəta baş verdi. <a href="." class="reload">Yenilə</a>
    </div>
    <script>
        /* iOS Safari viewport meta-sındakı user-scalable=no-nu nəzərə almır;
           pinch zoom yalnız gesture hadisələrini ləğv etməklə dayandırılır. */
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    </script>
    <script src="_content/Edutor.App.Shared/lib/hls/hls.min.js"></script>
    <script src="_content/Edutor.App.Shared/lib/pdfjs/pdf.min.js"></script>
    <script src="_content/Edutor.App.Shared/js/video-player.js"></script>
    <script>
        /* Giriş səhifəsində qoruma olmamalıdır: parol meneceri pəncərə fokusunu
           aldıqda ekran bulanıqlaşır və istifadəçi yazdığını görmür.
           Qoruma yalnız daxil olduqdan sonra MainLayout tərəfindən açılır. */
        window.LmsGuardConfig = { autoStart: false };
    </script>
    <script src="_content/Edutor.App.Shared/js/lms-guard.js"></script>
    <script src="_content/Edutor.App.Shared/js/pull-refresh.js"></script>
    <script src="_content/Edutor.App.Shared/js/push-sound.js"></script>
    <script src="_content/Edutor.App.Shared/js/web-push.js"></script>
    <script src="_content/Edutor.App.Shared/js/photo-crop.js"></script>
    <script>
        /* Blazor mount olmamışdan əvvəl göstərilən yükləmə ekranı — dil localStorage-dadır
           (Localizer "lms.lang" açarı ilə yazır), ona görə burada da həmin dəyər oxunur. */
        (function () {
            var texts = {
                az: { loading: 'Yüklənir...', wait: 'Bir az gözləyin', error: 'Xəta baş verdi.', reload: 'Yenilə', aria: 'Yüklənir' },
                en: { loading: 'Loading...', wait: 'Please wait a moment', error: 'An error occurred.', reload: 'Reload', aria: 'Loading' },
                ru: { loading: 'Загрузка...', wait: 'Подождите немного', error: 'Произошла ошибка.', reload: 'Обновить', aria: 'Загрузка' },
                tr: { loading: 'Yükleniyor...', wait: 'Biraz bekleyin', error: 'Bir hata oluştu.', reload: 'Yenile', aria: 'Yükleniyor' }
            };

            var lang = 'az';
            try { lang = localStorage.getItem('lms.lang') || 'az'; } catch (e) { }
            var text = texts[lang] || texts.az;

            document.documentElement.lang = lang;
            document.querySelector('.lms-boot').setAttribute('aria-label', text.aria);
            document.querySelector('.lms-boot-title').textContent = text.loading;
            document.querySelector('.lms-boot-sub').textContent = text.wait;

            var errorBox = document.getElementById('blazor-error-ui');
            errorBox.textContent = text.error + ' ';
            var reload = document.createElement('a');
            reload.href = '.';
            reload.className = 'reload';
            reload.textContent = text.reload;
            errorBox.appendChild(reload);
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
